name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish small exe (needs the .NET 8 Desktop Runtime)
        run: dotnet publish Scrawl.csproj -c Release -r win-x64 -p:SelfContained=false -p:PublishSingleFile=true -p:PublishReadyToRun=false -o publish-small
      - name: Clean build folders
        run: Remove-Item -Recurse -Force obj, bin
      - name: Publish standalone exe (runtime included)
        run: dotnet publish Scrawl.csproj -c Release -r win-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish-standalone
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv publish-standalone/Scrawl.exe Scrawl-standalone.exe
          ls -l publish-small/Scrawl.exe Scrawl-standalone.exe
          gh release create "$GITHUB_REF_NAME" publish-small/Scrawl.exe Scrawl-standalone.exe --generate-notes --title "Scrawl $GITHUB_REF_NAME"
